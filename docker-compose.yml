
services:
  streamlit:
    build:
      context: .
      dockerfile: dockerfile
      target: streamlit
    image: studentmind-streamlit:local
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: dockerfile
      target: airflow
    image: studentmind-airflow:local
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
    volumes:
      - airflow_data:/opt/airflow
      - .:/opt/airflow/project
      - ./dag:/opt/airflow/dags
    working_dir: /opt/airflow/project
    command: ["airflow", "standalone"]
    restart: unless-stopped

volumes:
  airflow_data:
